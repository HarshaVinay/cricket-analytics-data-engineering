version: 2

models:
  - name: br_cricket_teams
    description: Standardized team records from Snowflake RAW.
    columns:
      - name: TEAM_ID
        tests: [not_null, unique]

  - name: br_cricket_players
    description: Standardized player records from Snowflake RAW.
    columns:
      - name: PLAYER_ID
        tests: [not_null, unique]
      - name: CURRENT_TEAM_ID
        tests:
          - relationships:
              arguments:
                to: ref('br_cricket_teams')
                field: TEAM_ID

  - name: br_cricket_matches
    description: Standardized match records from Snowflake RAW.
    columns:
      - name: MATCH_ID
        tests: [not_null, unique]
      - name: TEAM_A_ID
        tests:
          - relationships:
              arguments:
                to: ref('br_cricket_teams')
                field: TEAM_ID
      - name: TEAM_B_ID
        tests:
          - relationships:
              arguments:
                to: ref('br_cricket_teams')
                field: TEAM_ID

  - name: br_cricket_deliveries
    description: Standardized ball-by-ball delivery records from Snowflake RAW.
    columns:
      - name: DELIVERY_ID
        tests: [not_null, unique]
      - name: MATCH_ID
        tests:
          - relationships:
              arguments:
                to: ref('br_cricket_matches')
                field: MATCH_ID

  - name: dim_date
    description: Conformed calendar dimension.
    columns:
      - name: SK_DATE
        tests: [not_null, unique]
      - name: DATE_VALUE
        tests: [not_null, unique]

  - name: dim_team
    description: Type 1 team dimension.
    columns:
      - name: SK_TEAM
        tests: [not_null, unique]
      - name: TEAM_ID
        tests: [not_null, unique]

  - name: dim_venue
    description: Type 1 venue dimension based on available VENUE_ID values.
    columns:
      - name: SK_VENUE
        tests: [not_null, unique]
      - name: VENUE_ID
        tests: [not_null, unique]

  - name: dim_player
    description: SCD Type 2 player dimension with tracked player attributes and effective dating.
    columns:
      - name: SK_PLAYER
        tests: [not_null, unique]
      - name: PLAYER_ID
        tests: [not_null]
      - name: EFF_START_TS
        tests: [not_null]
      - name: EFF_END_TS
        tests: [not_null]
      - name: IS_CURRENT
        tests: [not_null]

  - name: dim_match
    description: Type 1 match dimension.
    columns:
      - name: SK_MATCH
        tests: [not_null, unique]
      - name: MATCH_ID
        tests: [not_null, unique]

  - name: fact_delivery
    description: Ball-level fact table with one row per DELIVERY_ID.
    columns:
      - name: DELIVERY_ID
        tests: [not_null, unique]
      - name: MATCH_ID
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_match')
                field: MATCH_ID
      - name: TOTAL_RUNS
        tests: [not_null]
      - name: LEGAL_BALL
        tests: [not_null]

  - name: match_overview
    description: Gold match and innings level performance metrics.
    columns:
      - name: MATCH_ID
        tests: [not_null]

  - name: player_insights
    description: Gold player batting and bowling performance metrics.
    columns:
      - name: PLAYER_ID
        tests: [not_null]

  - name: team_venue_analytics
    description: Gold team and venue performance analytics.
    columns:
      - name: TEAM_ID
        tests: [not_null]

  - name: phase_analytics
    description: Gold over-phase analytics.
    columns:
      - name: MATCH_ID
        tests: [not_null]
