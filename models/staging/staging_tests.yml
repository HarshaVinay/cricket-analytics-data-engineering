version: 2

models:

  - name: stg_teams
    columns:
      - name: TEAM_ID
        tests:
          - not_null
          - unique

  - name: stg_players
    columns:
      - name: PLAYER_ID
        tests:
          - not_null
          - unique

      - name: CURRENT_TEAM_ID
        tests:
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: TEAM_ID

  - name: stg_matches
    columns:
      - name: MATCH_ID
        tests:
          - not_null
          - unique

      - name: TEAM_A_ID
        tests:
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: TEAM_ID

      - name: TEAM_B_ID
        tests:
          - relationships:
              arguments:
                to: ref('stg_teams')
                field: TEAM_ID

  - name: stg_deliveries
    columns:
      - name: DELIVERY_ID
        tests:
          - not_null
          - unique

      - name: MATCH_ID
        tests:
          - relationships:
              arguments:
                to: ref('stg_matches')
                field: MATCH_ID