name: cricket_analytics
description: Cricket analytics semantic model restricted to curated semantic views.
tables:
  - name: match_summary
    base_table:
      database: CRICKET_ANALYTICS
      schema: SEM
      table: V_MATCH_SUMMARY
    dimensions:
      - name: match_id
        expr: MATCH_ID
        data_type: VARCHAR
      - name: competition
        expr: COMPETITION
        data_type: VARCHAR
      - name: format
        expr: FORMAT
        data_type: VARCHAR
      - name: match_date
        expr: MATCH_DATE
        data_type: DATE
    metrics:
      - name: total_runs
        expr: SUM(TOTAL_RUNS)
      - name: wickets
        expr: SUM(WICKETS)
      - name: run_rate
        expr: AVG(RUN_RATE)
      - name: boundary_pct
        expr: AVG(BOUNDARY_PCT)
