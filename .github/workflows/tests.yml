name: cricket-analytics-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pandas pytest
      - name: Run source data tests
        run: pytest -q tests
